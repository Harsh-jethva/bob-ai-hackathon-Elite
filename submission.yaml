submission:
  title: "Container Congestion Predictor & Port Operations Optimiser"   # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Port operators face severe congestion caused by large numbers of vessels
    waiting offshore, limited berth and crane capacity, and inefficient manual
    allocation of port resources. Congestion is often identified only after
    vessels are already queuing, while alternate routing and operational
    decisions are made too late to prevent major supply-chain delays and costs.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We are building an AI-powered Container Congestion Predictor and Port
    Operations Optimiser that predicts congestion hotspots using vessel schedules
    and berth capacity data, recommends alternate routing strategies, optimises
    berth and crane assignments, and generates a 72-hour port operations plan
    for shift supervisors.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-based port congestion hotspot prediction using vessel schedules and berth capacity data"
    - "Alternate vessel routing recommendations to reduce congestion and waiting time"
    - "Optimised berth and crane assignment recommendations"
    - "72-hour port operations planning for shift supervisors"
    - "Early congestion detection and operational decision support"

  tech_stack:
    languages: ["Python"]
    frameworks: []
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["GitHub", "GitHub Actions", "AI/ML"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of combining congestion prediction with operational
    optimisation in a single decision-support solution. Instead of only
    identifying congestion after it occurs, the solution is designed to provide
    early warnings, alternate routing recommendations, resource allocation
    guidance, and a practical 72-hour operations plan.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Prediction and optimisation quality depends on the availability, accuracy,
    and timeliness of vessel schedule, berth capacity, and port operations data.
    Real-world deployment would require integration with live port systems,
    validation with historical and operational data, and continuous model
    monitoring.

