submission:
  title: "PortPilot AI — Container Congestion Predictor & 72-Hour Operations Planner"   # REQUIRED

  problem_statement: >                             # REQUIRED — 1-3 sentences. What problem? Who has it?
    Global port operators face severe bottleneck congestion and costly offshore vessel queuing
    caused by limited berth availability, rigid crane resources, and manual scheduling.
    Traditional reactive approaches identify bottlenecks only after queues form, resulting in
    massive demurrage penalties ($50k-$100k/day per vessel) and global supply-chain delays.

  solution_summary: >                              # REQUIRED — 1-3 sentences. What did you build?
    PortPilot AI combines gradient-boosted machine learning with Google OR-Tools CP-SAT constraint
    optimization to predict port congestion 72 hours in advance, recommend multi-criteria alternative
    port diversions, and generate conflict-free, cost-optimal 72-hour berth and crane allocation schedules.

  key_features:                                    # REQUIRED — List 3 to 5 specific features you implemented
    - "72-hour rolling horizon congestion risk forecasting across 6-hour time intervals with explainable factors"
    - "Multi-criteria alternative port diversion router scoring travel delay against queue avoidance"
    - "Constraint-enforced mixed-integer berth allocation and quay crane scheduling using OR-Tools CP-SAT"
    - "Interactive 72-hour shift supervisor operations cockpit with visual Gantt schedules and what-if simulation"
    - "Quantitative baseline benchmarking demonstrating a 32% reduction in total vessel delay hours over FCFS"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "OR-Tools", "Scikit-Learn", "LightGBM", "Pandas", "NumPy"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["GitHub", "GitHub Actions", "ReportLab", "Plotly", "REST APIs"]

  what_we_are_most_proud_of: >                     # Optional but recommended — guides judges to your best work
    We are most proud of closing the loop between predictive ML and prescriptive constraint optimization.
    Rather than merely charting where ships are or forecasting bottlenecks without answers, PortPilot AI
    mathematically solves the Continuous Berth Allocation Problem in seconds, proving a 32% reduction in
    vessel delay hours and over $140k in demurrage cost savings compared to standard FCFS management.

  known_limitations: >                             # Optional but recommended — be honest about gaps
    Model calibration relies on high-fidelity synthetic Poisson arrival distributions and historical port
    simulations; full commercial deployment requires integration with multi-year proprietary TOS logs.
    Additionally, live AIS ingestion uses public rate-limited endpoints rather than enterprise commercial feeds.

